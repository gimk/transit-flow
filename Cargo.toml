[workspace]
resolver = "3"
members = ["crates/tf_sim", "crates/tf_game"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Every dependency is pinned here; crates use `{ workspace = true }`.
# Don't upgrade Bevy until the migration is done (docs/BEVY_MIGRATION_PLAN.md §8).
[workspace.dependencies]
tf_sim = { path = "crates/tf_sim" }
# Bevy features are added only when code needs one (user rule, 2026-11-16): no profile
# features (`2d`, `ui`, default). No 3D, audio, gamepad, scenes, picking, Linux backends.
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",               # everything (bevy_internal std)
    "multi_threaded",    # parallel ECS and render
    "async_executor",    # task pools
    "bevy_asset",        # Assets<Mesh>, Assets<ColorMaterial>
    "bevy_log",          # LogPlugin, info! / error!
    "bevy_window",       # Window, PrimaryWindow; also turns on the keyboard, mouse, touch and gesture inputs
    "bevy_winit",        # the OS window and its events (macOS, Windows)
    "bevy_camera",       # Camera, NoFrustumCulling, visibility
    "bevy_mesh",         # Mesh, Indices, VertexAttributeValues
    "bevy_render",       # renderer, Screenshot
    "bevy_core_pipeline", # Camera2d
    "bevy_sprite_render", # Mesh2d, MeshMaterial2d, ColorMaterial
    "bevy_gizmos",       # Gizmos, GizmoPlugin
    "bevy_gizmos_render", # draws the gizmos
    "bevy_ui",           # Node (status line)
    "bevy_ui_render",    # draws the UI
    "bevy_text",         # Text, TextFont
    "default_font",      # the status line has no font file
    "png",               # screenshot save_to_disk writes PNG
] }
# Must stay the glam version Bevy uses, so sim and game share one Vec2 type.
glam = { version = "=0.33.12", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ron = "=0.12.3"
indexmap = { version = "=2.14.2", features = ["serde"] }
smallvec = "=1.16.5"
approx = "=0.5.1"

[profile.dev]
opt-level = 1

# Bevy and other dependencies are unusably slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 3

[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 1
